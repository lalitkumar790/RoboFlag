name: Physics-aware planner development
on:
  push:
    branches: [physics-validation]
    paths: ['roboflag/physics_planner.py','roboflag/physics_fleet.py','tests/test_physics_planner.py','.github/workflows/physics-aware.yml']
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        robots: [6, 12, 24]
        seed: [4300, 4301]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-physics.txt
      - run: python -m pytest -q tests/test_physics_planner.py tests/test_physics_fleet.py
      - run: python -m roboflag.physics_fleet --robots ${{ matrix.robots }} --seeds ${{ matrix.seed }} --modes astar congestion_aware physics_aware > physics-aware.json
      - run: python -c 'import json; print(json.dumps([{k:v for k,v in r.items() if k!="trace"} for r in json.load(open("physics-aware.json"))],indent=2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-aware-${{ matrix.robots }}-${{ matrix.seed }}
          path: physics-aware.json
