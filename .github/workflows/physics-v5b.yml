name: V5b conditional cycle development
on:
  push:
    branches: [physics-validation]
    paths: ['.github/workflows/physics-v5b.yml']
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - robots: 24
            seed: 4600
          - robots: 24
            seed: 4601
          - robots: 24
            seed: 4800
          - robots: 24
            seed: 4801
          - robots: 12
            seed: 4800
          - robots: 6
            seed: 4800
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-physics.txt
      - run: python -m pytest -q tests/test_physics_planner.py tests/test_physics_dynamic_fleet.py
      - run: python -m roboflag.physics_dynamic_fleet --robots ${{ matrix.robots }} --seed ${{ matrix.seed }} --modes progress_aware cycle_aware > v5b.json
      - run: python -c 'import json; print(json.dumps([{k:v for k,v in r.items() if k!="trace"} for r in json.load(open("v5b.json"))],indent=2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5b-${{ matrix.robots }}-${{ matrix.seed }}
          path: v5b.json
