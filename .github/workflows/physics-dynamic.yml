name: Dynamic physical obstacle feasibility
on:
  push:
    branches: [physics-validation]
    paths: ['roboflag/physics_dynamic.py','tests/test_physics_dynamic.py','.github/workflows/physics-dynamic.yml']
  workflow_dispatch:
jobs:
  dynamic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-physics.txt
      - run: python -m roboflag.physics_dynamic > dynamic-smoke.json
      - run: python -c 'import json; print(json.dumps([{k:v for k,v in r.items() if k!="trace"} for r in json.load(open("dynamic-smoke.json"))],indent=2))'
      - run: python -m pytest -q tests/test_physics_dynamic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-obstacle-smoke
          path: dynamic-smoke.json
