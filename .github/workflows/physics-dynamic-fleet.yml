name: Dynamic fleet development
on:
  push:
    branches: [physics-validation]
    paths: ['roboflag/physics_dynamic_fleet.py','tests/test_physics_dynamic_fleet.py','.github/workflows/physics-dynamic-fleet.yml']
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        robots: [6,12,24]
        seed: [4600,4601]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-physics.txt
      - run: python -m pytest -q tests/test_physics_dynamic_fleet.py
      - run: python -m roboflag.physics_dynamic_fleet --robots ${{ matrix.robots }} --seed ${{ matrix.seed }} > dynamic-fleet.json
      - run: python -c 'import json; print(json.dumps([{k:v for k,v in r.items() if k!="trace"} for r in json.load(open("dynamic-fleet.json"))],indent=2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-fleet-${{ matrix.robots }}-${{ matrix.seed }}
          path: dynamic-fleet.json
