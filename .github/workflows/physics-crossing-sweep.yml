name: Dynamic crossing timing sweep
on:
  push:
    branches: [physics-validation]
    paths: ['roboflag/physics_crossing_sweep.py','tests/test_physics_crossing_sweep.py','.github/workflows/physics-crossing-sweep.yml']
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-physics.txt
      - run: python -m roboflag.physics_crossing_sweep > crossing-sweep.json
      - run: python -c 'import json; print(json.dumps([{k:v for k,v in r.items() if k!="trace"} for r in json.load(open("crossing-sweep.json"))],indent=2))'
      - run: python -m pytest -q tests/test_physics_crossing.py tests/test_physics_crossing_sweep.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crossing-timing-sweep
          path: crossing-sweep.json
