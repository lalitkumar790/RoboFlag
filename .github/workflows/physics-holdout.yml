name: Frozen V2 V4 static physics holdout
on:
  push:
    branches: [physics-validation]
    paths: ['.github/workflows/physics-holdout.yml']
  workflow_dispatch:
jobs:
  holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        robots: [6, 12, 24]
        seed: [4500, 4501, 4502, 4503]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3f53cb979ddfd293f4a10fbd8b630091b5d22ede
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-physics.txt
      - run: python -m pytest -q tests/test_physics_planner.py tests/test_physics_fleet.py
      - run: python -m roboflag.physics_fleet --robots ${{ matrix.robots }} --seeds ${{ matrix.seed }} --modes congestion_aware progress_aware > holdout.json
      - run: python -c 'import json; print(json.dumps([{**{k:v for k,v in r.items() if k not in ("trace","progress_diagnostics")}, "revisits":sum(p["revisits"] for p in r["progress_diagnostics"]), "reversals":sum(p["immediate_reversals"] for p in r["progress_diagnostics"])} for r in json.load(open("holdout.json"))],indent=2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holdout-${{ matrix.robots }}-${{ matrix.seed }}
          path: holdout.json
