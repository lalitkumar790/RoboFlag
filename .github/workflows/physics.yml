name: Native MuJoCo feasibility
on:
  push:
    branches: [physics-validation]
  workflow_dispatch:
jobs:
  physics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-physics.txt
      - run: python -m roboflag.physics --smoke > physics-smoke.json
      - run: cat physics-smoke.json
      - run: python -m roboflag.physics_tracking > physics-tracking.json
      - run: python -m pytest -q tests/test_physics.py tests/test_physics_tracking.py tests/test_physics_fleet.py
      - run: python -m roboflag.physics_fleet --robots 6 --seeds 4100 4101 4102 > physics-fleet.json
      - run: python -c 'import json; print(json.dumps([{k:v for k,v in r.items() if k!="trace"} for r in json.load(open("physics-fleet.json"))],indent=2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-physics-smoke
          path: |
            physics-smoke.json
            physics-tracking.json
            physics-fleet.json
