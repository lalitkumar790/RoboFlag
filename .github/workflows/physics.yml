name: Native MuJoCo feasibility
on:
  push:
    branches: [physics-validation]
  workflow_dispatch:
jobs:
  physics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-physics.txt
      - run: python -m roboflag.physics --smoke > physics-smoke.json
      - run: cat physics-smoke.json
      - run: python -m pytest -q tests/test_physics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-physics-smoke
          path: physics-smoke.json
